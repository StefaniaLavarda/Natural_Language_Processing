project:
  name: "Truth, Lies, and Reasoning Machines"
  seed: 42

data:
  truthfulqa_path: "data/raw/TruthfulQA.csv"
  hotpotqa_path: "data/raw/hotpot_dev_distractor_v1.json"

  truthfulqa_sample_size: 25
  hotpotqa_sample_size: 25
  hotpotqa_max_context_paragraphs: 8

model:
  model_name: "google/flan-t5-base"
  max_input_tokens: 512
  max_new_tokens: 250

outputs:
  processed_dir: "data/processed"
  outputs_dir: "results/outputs"
  plots_dir: "results/plots"

analysis:
  run_probability_tracing: true
  run_attention_analysis: true
  attention_examples_per_group: 1
  attention_max_tokens: 30

evaluation:
  fuzzy_threshold: 85
