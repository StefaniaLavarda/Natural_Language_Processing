project:
  name: "Truth, Lies, and Reasoning Machines"
  seed: 42

data:
  truthfulqa_path: "data/raw/TruthfulQA.csv"
  hotpotqa_path: "data/raw/hotpot_dev_distractor_v1.json"

  truthfulqa_sample_size: 25
  hotpotqa_sample_size: 25
  hotpotqa_max_context_paragraphs: 4

model:
  backend: "tinyllama"
  model_name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  max_input_tokens: 1024
  max_new_tokens: 120
  temperature: 0.0
  do_sample: false
  device: "auto"

outputs:
  processed_dir: "data/processed"
  outputs_dir: "results/outputs"
  plots_dir: "results/plots"

evaluation:
  fuzzy_threshold: 80
